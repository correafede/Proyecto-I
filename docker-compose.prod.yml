version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pg-biblioteca
    environment:
      POSTGRES_USER: ${DB_USER:-federico}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proceso_seguro_2026}
      POSTGRES_DB: ${DB_NAME:-biblioteca_seguridad}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql
    command: >
      postgres
      -c password_encryption=md5
      -c log_statement=all
      -c log_duration=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-federico}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - biblioteca
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-biblioteca
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://${DB_USER:-federico}:${DB_PASSWORD:-proceso_seguro_2026}@postgres:5432/${DB_NAME:-biblioteca_seguridad}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - biblioteca
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nginx-biblioteca
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - biblioteca
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  biblioteca:
    driver: bridge
