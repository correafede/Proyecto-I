<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Seguridad de Procesos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            max-height: 900px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px 24px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.assistant .message-content {
            background: #f0f2f5;
            color: #333;
            border-left: 3px solid #667eea;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 12px 2px 12px 12px;
        }

        .welcome-message {
            text-align: center;
            padding: 24px;
            color: #666;
        }

        .welcome-message h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .welcome-message p {
            font-size: 14px;
            margin-bottom: 16px;
        }

        .suggested-questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .suggested-btn {
            padding: 8px 12px;
            background: #f0f2f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #667eea;
            transition: all 0.2s;
        }

        .suggested-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .citations {
            margin-top: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-left: 3px solid #667eea;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .citations strong {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .citation-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .citation-badge {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 12px;
        }

        .confidence {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .insufficient {
            background: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }

        .error-message {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 3px solid #dc3545;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #999;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #e5e5e5;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 90%;
            }

            .header {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .suggested-questions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Asistente de Seguridad de Procesos</h1>
            <p>Biblioteca Inteligente — Respuestas citadas y verificadas</p>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty-state">
                <div style="font-size: 48px; margin-bottom: 16px;">📚</div>
                <h2 style="color: #333; margin-bottom: 8px;">Bienvenido a la Biblioteca</h2>
                <p style="text-align: center; max-width: 300px;">
                    Haz preguntas sobre HAZOP, LOPA, MOC, procedimientos de seguridad, incidentes y normas de la industria.
                </p>
                <div class="suggested-questions" style="margin-top: 20px;">
                    <button class="suggested-btn" onclick="askQuestion('¿Qué es HAZOP?')">¿Qué es HAZOP?</button>
                    <button class="suggested-btn" onclick="askQuestion('¿Qué es LOPA?')">¿Qué es LOPA?</button>
                    <button class="suggested-btn" onclick="askQuestion('¿Qué es MOC?')">¿Qué es MOC?</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Escribe tu pregunta aquí..." 
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendQuestion()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        let isFirstMessage = true;

        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendQuestion();
            }
        });

        function askQuestion(question) {
            questionInput.value = question;
            sendQuestion();
        }

        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Clear empty state on first message
            if (isFirstMessage) {
                chatArea.innerHTML = '';
                isFirstMessage = false;
            }

            addMessage(question, 'user');
            questionInput.value = '';
            sendBtn.disabled = true;

            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message assistant';
            loadingMsg.innerHTML = '<div class="message-content"><div class="loading"><div class="spinner"></div> Buscando en la biblioteca...</div></div>';
            chatArea.appendChild(loadingMsg);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const response = await fetch('/asistente/preguntar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pregunta: question,
                        umbral_relevancia: 0.2
                    })
                });

                const data = await response.json();
                loadingMsg.remove();

                if (response.ok) {
                    if (data.informacion_insuficiente) {
                        addMessage(
                            data.respuesta || 'No tengo información suficiente para responder.',
                            'assistant',
                            true
                        );
                    } else {
                        addMessage(data.respuesta || 'Sin respuesta', 'assistant', false, data.citas || [], data.confianza || 0);
                    }
                } else {
                    addMessage(`Error (${response.status}): ${data.detail || 'Error desconocido'}`, 'assistant', true);
                }
            } catch (error) {
                loadingMsg.remove();
                addMessage(`Error: ${error.message}`, 'assistant', true);
            }

            sendBtn.disabled = false;
            questionInput.focus();
        }

        function addMessage(text, role, isError = false, citas = [], confianza = 0) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            let html = `<div class="message-content${isError ? ' error-message' : ''}">`;
            html += text;

            if (!isError && citas && citas.length > 0) {
                html += `<div class="citations">
                    <strong>Fuentes</strong>
                    <div class="citation-list">
                        ${citas.map(c => `<span class="citation-badge">${c}</span>`).join('')}
                    </div>
                </div>`;
            }

            if (!isError && confianza) {
                html += `<div class="confidence">Confianza: ${(confianza * 100).toFixed(0)}%</div>`;
            }

            html += '</div>';
            msgDiv.innerHTML = html;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    </script>
</body>
</html>
