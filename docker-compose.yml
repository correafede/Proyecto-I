version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pg-biblioteca
    environment:
      POSTGRES_USER: federico
      POSTGRES_PASSWORD: proceso_seguro_2026
      POSTGRES_DB: biblioteca_seguridad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql
    command: >
      postgres
      -c password_encryption=md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U federico"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biblioteca

  api:
    build: .
    container_name: api-biblioteca
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://federico:proceso_seguro_2026@postgres:5432/biblioteca_seguridad"
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - biblioteca
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  biblioteca:
    driver: bridge
